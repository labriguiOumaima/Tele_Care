spring.application.name=service-utilisateurs
server.port=8084

# V1 : fonctionnement autonome
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Base propre au service Utilisateurs
spring.datasource.url=jdbc:h2:file:./data/utilisateurs
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Authentification HTTP Basic
app.security.username=${SERVICE_UTILISATEURS_USERNAME:admin}
app.security.password=${SERVICE_UTILISATEURS_PASSWORD:admin123}