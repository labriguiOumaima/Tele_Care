spring.application.name=service-utilisateurs
server.port=8084

# Configuration locale
spring.cloud.config.enabled=false

# V2 : enregistrement dans Eureka
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Base propre au service Utilisateurs
spring.datasource.url=jdbc:h2:file:./data/utilisateurs
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Authentification HTTP Basic
app.security.username=${SERVICE_UTILISATEURS_USERNAME:admin}
app.security.password=${SERVICE_UTILISATEURS_PASSWORD:admin123}