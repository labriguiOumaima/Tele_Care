
server.port=8085

# Base de donnees H2 persistante
spring.datasource.url=jdbc:h2:file:./data/service-notification
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info

server.error.include-message=always

# Enregistrement dans Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# Kafka : consommateur seulement (intervention-assigned, emergency-resolved)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=service-notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# OpenFeign : delais par appel (ms)
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Resilience4j : ordre des aspects
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3

# Resilience4j : appel a service-beneficiaires (contacts)
resilience4j.retry.instances.beneficiaires-service.max-attempts=3
resilience4j.retry.instances.beneficiaires-service.wait-duration=500ms
resilience4j.retry.instances.beneficiaires-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.circuitbreaker.instances.beneficiaires-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.beneficiaires-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.beneficiaires-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.beneficiaires-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.beneficiaires-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.beneficiaires-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.beneficiaires-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.beneficiaires-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.bulkhead.instances.beneficiaires-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.beneficiaires-service.max-wait-duration=0ms


spring.h2.console.enabled=true
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.from=${MAIL_FROM:telecare@localhost.test}
