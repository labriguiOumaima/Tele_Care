
# Port du service
server.port=8084

# Base de donnees H2 propre au service
spring.datasource.url=jdbc:h2:file:./data/service-utilisateurs
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA et console H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Enregistrement dans Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false

# Actuator
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
server.error.include-binding-errors=always

# Securite (credentials injectes par variables d'environnement ou Config Server)
app.security.username=${SERVICE_UTILISATEURS_USERNAME:admin}
app.security.password=${SERVICE_UTILISATEURS_PASSWORD:admin123}

eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
