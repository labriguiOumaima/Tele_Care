server.port=8083

spring.datasource.url=jdbc:h2:mem:interventionsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info

server.error.include-message=always
server.error.include-binding-errors=always

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}
# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consommateur (alert-triggered)
spring.kafka.consumer.group-id=service-interventions
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producteur (intervention-assigned, emergency-resolved)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Jalon v6.0 : OpenFeign, delais par appel (ms)
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Jalon v6.0 : ordre des aspects
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3

# Jalon v6.0 : Retry
resilience4j.retry.instances.alertes-service.max-attempts=3
resilience4j.retry.instances.alertes-service.wait-duration=500ms
resilience4j.retry.instances.alertes-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Jalon v6.0 : Circuit breaker
resilience4j.circuitbreaker.instances.alertes-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.alertes-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.alertes-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.alertes-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.alertes-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertes-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.alertes-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.alertes-service.automatic-transition-from-open-to-half-open-enabled=true

# Jalon v6.0 : Bulkhead
resilience4j.bulkhead.instances.alertes-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.alertes-service.max-wait-duration=0ms

# Jalon v6.0 : RateLimiter
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms


# Jalon v6.0 : protection de l'appel au protocole
resilience4j.retry.instances.protocole-service.max-attempts=3
resilience4j.retry.instances.protocole-service.wait-duration=500ms
resilience4j.retry.instances.protocole-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.circuitbreaker.instances.protocole-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.protocole-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.protocole-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.protocole-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.protocole-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.protocole-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.protocole-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.protocole-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.bulkhead.instances.protocole-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.protocole-service.max-wait-duration=0ms



# Etape V4 : protection de l'appel a service-utilisateurs (verification de l'assistant)
resilience4j.retry.instances.utilisateurs-service.max-attempts=3
resilience4j.retry.instances.utilisateurs-service.wait-duration=500ms
resilience4j.retry.instances.utilisateurs-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.circuitbreaker.instances.utilisateurs-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.utilisateurs-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.utilisateurs-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.utilisateurs-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.utilisateurs-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.utilisateurs-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.utilisateurs-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.utilisateurs-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.bulkhead.instances.utilisateurs-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.utilisateurs-service.max-wait-duration=0ms