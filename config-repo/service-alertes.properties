# ============================================================
#  service-alertes — Configuration externalisée (Port 8082)
#  Lue par Spring Cloud Config Server (config-repo/)
# ============================================================

server.port=8082

# ── Base de données H2 dédiée ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:alertesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA & H2 Console ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Enregistrement Eureka (Jalon V2) ──────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── Kafka (Jalon V5) ─────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alertes-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.assistance.alertes.dto.event,com.assistance.*

# ── OpenFeign & Resilience4j (Jalons V4 & V6) ──────────────────
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Retry
resilience4j.retry.instances.beneficiaires-service.max-attempts=3
resilience4j.retry.instances.beneficiaires-service.wait-duration=500ms

# Circuit Breaker
resilience4j.circuitbreaker.instances.beneficiaires-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.beneficiaires-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.beneficiaires-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.beneficiaires-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.beneficiaires-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.beneficiaires-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.beneficiaires-service.automatic-transition-from-open-to-half-open-enabled=true

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
