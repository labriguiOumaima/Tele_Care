spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false
spring.kafka.listener.auto-startup=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.security.username=admin
app.security.password=admin123
spring.mail.host=localhost
spring.mail.port=1025
resilience4j.retry.instances.beneficiaires-service.max-attempts=3
resilience4j.retry.instances.beneficiaires-service.wait-duration=1ms
resilience4j.retry.instances.beneficiaires-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable
resilience4j.circuitbreaker.instances.beneficiaires-service.ignore-exceptions=feign.FeignException$FeignClientException
spring.kafka.admin.auto-create=false
